[workspace]
members = ["verso", "versoview_messages", "versoview_build"]

[workspace.package]
version = "0.0.4"
edition = "2024"
license = "Apache-2.0 OR MIT"
homepage = "https://github.com/xizar280513/verso"
repository = "https://github.com/xizar280513/verso"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
ipc-channel = "0.19"
bincode = "1"
url = { version = "2.5.2", features = ["serde"] }
log = "0.4"
headers = "0.4"
http = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dpi = { version = "0.1", features = ["serde"] }

[package]
name = "versoview"
version.workspace = true
edition.workspace = true
authors = ["Wu Yu Wei", "Verso Updated contributors"]
license.workspace = true
description = "Verso Updated - Community continuation of the Verso browser"
readme = "README.md"
homepage.workspace = true
repository.workspace = true
documentation = "https://github.com/xizar280513/verso"
categories = ["web-programming"]

[package.metadata.packager]
name = "verso"
product-name = "Verso Updated"
identifier = "org.versotile.verso"
version = "0.0.4"
before-each-package-command = "python etc/package_libs.py"
resources = [
  "resources",
  "icons",
  "target/release/build/**/libEGL.dll",
  "target/release/build/**/libGLESv2.dll",
  "target/release/lib",
]
icons = ["icons/icon256x256.png", "icons/icon.ico"]

[package.metadata.packager.nsis]
appdata-paths = ["$LOCALAPPDATA/$IDENTIFIER"]

[package.metadata.docs.rs]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "x86_64-apple-darwin",
]

[features]
bluetooth = [
    "bluetooth_traits",
    "dep:bluetooth",
    "constellation/bluetooth",
    "constellation_traits/bluetooth",
    "script/bluetooth",
    "script_traits/bluetooth",
]
background_hang_monitor = ["background_hang_monitor/sampler"]
default = ["bluetooth", "background_hang_monitor"]
packager = ["dep:cargo-packager-resource-resolver"]
flatpak = []
tracing = []
embed-useragent-stylesheets = []

[build-dependencies]
cfg_aliases = "0.2"

[dependencies]
arboard = "3.4.0"
crossbeam-channel = "0.5"
env_logger = "0.11"
euclid = "0.22"
getopts = "0.2.17"
gleam = "0.15"
glutin = "0.32.0"
glutin-winit = "0.5.0"
ipc-channel = { workspace = true }
keyboard-types = "0.7"
log = { workspace = true }
raw-window-handle = { version = "0.6", features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
sparkle = "0.1.26"
thiserror = "1.0"
winit = { version = "0.30", features = ["rwh_06"] }
dpi = { workspace = true }
url = { workspace = true }
headers = { workspace = true }
http = { workspace = true }
versoview_messages = { path = "./versoview_messages" }
serde = { workspace = true }
serde_json = "1.0"
bincode = { workspace = true }
mime = "0.3"
uuid = { workspace = true }
rfd = "0.15"
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }
# Servo repo crates — Option B intermediate: v0.2.0
# rev = 6a0f9e4a7851175c442a1f1b7a988e075c67c537
# package aliases retained from Manus v0.4.0 exploration (post package-rename era)
background_hang_monitor = { package = "background_hang_monitor", git = "https://github.com/servo/servo.git", rev = "721214fbe44bf11b968e5e076e5b0af5b5663447" }
base = { package = "base", git = "https://github.com/servo/servo.git", rev = "721214fbe44bf11b968e5e076e5b0af5b5663447" }
bluetooth = { package = "bluetooth", git = "https://github.com/servo/servo.git", rev = "721214fbe44bf11b968e5e076e5b0af5b5663447", optional = true }
bluetooth_traits = { package = "bluetooth_traits", git = "https://github.com/servo/servo.git", rev = "721214fbe44bf11b968e5e076e5b0af5b5663447", optional = true }
canvas = { package = "canvas", git = "https://github.com/servo/servo.git", rev = "721214fbe44bf11b968e5e076e5b0af5b5663447" }
compositing_traits = { package = "compositing_traits", git = "https://github.com/servo/servo.git", rev = "721214fbe44bf11b968e5e076e5b0af5b5663447" }
constellation = { package = "constellation", git = "https://github.com/servo/servo.git", rev = "721214fbe44bf11b968e5e076e5b0af5b5663447" }
constellation_traits = { package = "constellation_traits", git = "https://github.com/servo/servo.git", rev = "721214fbe44bf11b968e5e076e5b0af5b5663447" }
devtools = { package = "devtools", git = "https://github.com/servo/servo.git", rev = "721214fbe44bf11b968e5e076e5b0af5b5663447" }
embedder_traits = { package = "embedder_traits", git = "https://github.com/servo/servo.git", rev = "721214fbe44bf11b968e5e076e5b0af5b5663447" }
fonts = { package = "fonts", git = "https://github.com/servo/servo.git", rev = "721214fbe44bf11b968e5e076e5b0af5b5663447" }
layout_thread_2020 = { package = "layout", git = "https://github.com/servo/servo.git", rev = "721214fbe44bf11b968e5e076e5b0af5b5663447" }
media = { package = "media", git = "https://github.com/servo/servo.git", rev = "721214fbe44bf11b968e5e076e5b0af5b5663447" }
net = { package = "net", git = "https://github.com/servo/servo.git", rev = "721214fbe44bf11b968e5e076e5b0af5b5663447" }
net_traits = { package = "net_traits", git = "https://github.com/servo/servo.git", rev = "721214fbe44bf11b968e5e076e5b0af5b5663447" }
profile = { package = "profile", git = "https://github.com/servo/servo.git", rev = "721214fbe44bf11b968e5e076e5b0af5b5663447" }
profile_traits = { package = "profile_traits", git = "https://github.com/servo/servo.git", rev = "721214fbe44bf11b968e5e076e5b0af5b5663447" }
script = { package = "script", git = "https://github.com/servo/servo.git", rev = "721214fbe44bf11b968e5e076e5b0af5b5663447" }
script_traits = { package = "script_traits", git = "https://github.com/servo/servo.git", rev = "721214fbe44bf11b968e5e076e5b0af5b5663447" }
servo_allocator = { package = "servo_allocator", git = "https://github.com/servo/servo.git", rev = "721214fbe44bf11b968e5e076e5b0af5b5663447" }
servo_config = { package = "servo_config", git = "https://github.com/servo/servo.git", rev = "721214fbe44bf11b968e5e076e5b0af5b5663447" }
servo_geometry = { package = "servo_geometry", git = "https://github.com/servo/servo.git", rev = "721214fbe44bf11b968e5e076e5b0af5b5663447" }
servo_url = { package = "servo_url", git = "https://github.com/servo/servo.git", rev = "721214fbe44bf11b968e5e076e5b0af5b5663447" }
webdriver_server = { package = "webdriver_server", git = "https://github.com/servo/servo.git", rev = "721214fbe44bf11b968e5e076e5b0af5b5663447" }
webgpu = { package = "webgpu", git = "https://github.com/servo/servo.git", rev = "721214fbe44bf11b968e5e076e5b0af5b5663447" }
webgpu_traits = { package = "webgpu_traits", git = "https://github.com/servo/servo.git", rev = "721214fbe44bf11b968e5e076e5b0af5b5663447" }
# Servo org crates
servo-media = { git = "https://github.com/servo/media" }
servo-media-dummy = { git = "https://github.com/servo/media" }
stylo = { git = "https://github.com/servo/stylo", branch = "2025-03-15" }
stylo_traits = { git = "https://github.com/servo/stylo", branch = "2025-03-15" }
webrender = { git = "https://github.com/servo/webrender", branch = "0.66", features = ["capture"] }
webrender_api = { git = "https://github.com/servo/webrender", branch = "0.66" }
wr_malloc_size_of = { git = "https://github.com/servo/webrender", branch = "0.66" }
# Packager feature
cargo-packager-resource-resolver = { version = "0.1.1", features = [
  "auto-detect-format",
], optional = true }
chrono = "0.4.41"
percent-encoding = "2.3.1"
directories = "6.0.0"

[target.'cfg(all(unix, not(target_os = "macos"), not(target_os = "ios"), not(target_os = "android")))'.dependencies]
notify-rust = { version = "4.11.5", features = ["images"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
notify-rust = "4.11.5"
muda = "0.15"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2.2", features = ["NSThread"] }
objc2-app-kit = { version = "0.2", features = [
  "NSView",
  "NSResponder",
  "NSWindow",
] }

[[test]]
name = "general"
harness = false

[profile.release-lto]
inherits = "release"
lto = true

# Tell clippy to allow e.g. #[cfg(macos)]
[lints.rust]
unexpected_cfgs = "allow"
